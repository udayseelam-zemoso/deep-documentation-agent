# =============================================================================
# Deep Documentation Agent - settings
# File: src/main/resources/application.yml
# Packed into the JAR and loaded on startup. Edit this file, then rebuild.
#
# Logging format is still in logback.xml. Logback only reads XML, not YAML.
# =============================================================================

# Shown in the CLI banner
app:
  name: Deep Documentation Agent
  version: 1.0.0

# File discovery: which folders and file types to skip
analysis:
  ignoreDirectories:
    - .git
    - .svn
    - .hg
    - node_modules
    - bower_components
    - target
    - build
    - dist
    - out
    - .idea
    - .vscode
    - .eclipse
    - vendor
    - __pycache__
    - .gradle
  ignoreExtensions:
    - .class
    - .jar
    - .war
    - .ear
    - .o
    - .so
    - .dll
    - .dylib
    - .exe
    - .bin
    - .log
    - .tmp
    - .temp
    - .min.js
    - .min.css
    - .map

# Git history (activity signal for importance ranking)
git:
  enabled: true
  # Only commits from this window are read
  historyMonths: 24
  # A commit this many days old counts half as much as one made today
  halfLifeDays: 180
  maxCommits: 5000
  # Commits touching more files than this (reformatting, renames, initial import) are ignored
  bulkCommitFileLimit: 50
  maxCommitMessages: 100

# Dependency graph: which files are ranked, how imports become edges, how files form packages.
# See docs/README.md for the full approach.
graph:
  # Test files import everything and would look central, so they are left out
  includeTests: false
  # Package depth is chosen automatically so the package graph has this many nodes
  minPackages: 5
  maxPackages: 25
  # A package holding more than this share of files is split one level deeper...
  splitFraction: 0.3
  # ...but only if it has at least this many files
  splitMinFiles: 20
  # JS/TS import aliases that are not declared in tsconfig.json/jsconfig.json, e.g. ones
  # defined only in vite.config.ts or webpack.config.js. Key = import prefix, value =
  # directory relative to the repository root. Example:
  #   jsAliases:
  #     "@": src
  #     "@components": src/components
  jsAliases: {}
  # Languages without a dedicated extractor (Clojure, Elixir, Dart, Lua, ...) are parsed by a
  # generic fallback. Because its edges are the least certain, such files are also linked to
  # files they are repeatedly committed with: at least coChangeMinCommits shared commits that
  # make up at least coChangeMinCoupling of the less-changed file's commits. Commits touching
  # more than coChangeMaxFilesPerCommit files (mass renames, reformatting) are ignored.
  coChangeEdges: true
  coChangeMinCommits: 3
  coChangeMinCoupling: 0.5
  coChangeMaxFilesPerCommit: 30

# Importance ranking
#   package score = structureWeight * percentile(package PageRank)
#                 + activityWeight  * percentile(ln(1 + package commits))
#   local score   = localStructureWeight * PageRank / max PageRank in package
#                 + localActivityWeight  * ln(1 + commits) / max in package
#                 + localBoundaryWeight  * (entry point or used by another package)
#   priority      = package score * local score
# Without Git history the activity terms are dropped and the rest re-weighted.
ranking:
  dampingFactor: 0.85
  # Reverse edge weight relative to the forward one, so files that use a lot also gain rank
  backEdgeFactor: 0.25
  # Package score = structureWeight * pct(PageRank) + activityWeight * pct(activity)
  structureWeight: 0.6
  activityWeight: 0.4
  # File score inside its package (structure, activity, boundary bonus)
  localStructureWeight: 0.5
  localActivityWeight: 0.3
  localBoundaryWeight: 0.2
  # Share of ranked files that get a deep (per-file) write-up
  deepFraction: 0.2

# Where generated docs will go (Week 3)
output:
  defaultDirectory: docs
  format: markdown
  generateDiagrams: true

# LLM settings (Week 2). Not called yet.
llm:
  enabled: true
  provider: openai
  model: gpt-4
  maxTokens: 2000
  temperature: 0.3
